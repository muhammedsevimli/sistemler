<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurul Odası</title>
<style>
  @font-face { font-family:"Geist"; src:url("fonts/Geist.ttf") format("truetype"); font-weight:100 900; }
  :root {
    --bg:#fbfaf6; --kart:#ffffff; --ink:#0b1020; --ink2:#555d6e; --ink3:#8a92a3; --cizgi:#e1e4ed; --tint:#e9edff; --tint2:#f3f5ff;
    --mavi:#2054ff; --lav:#c3cbed; --yesil:#1f9d6a; --kirmizi:#d9452b; --sari:#f2e83f;
    --ease:cubic-bezier(.32,.72,0,1); --ease2:cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Geist",system-ui,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; letter-spacing:-.01em; }
  .sahne { height:100%; display:grid; grid-template-columns:minmax(0,1.55fr) minmax(340px,.85fr); grid-template-rows:auto minmax(0,1fr); column-gap:18px; row-gap:12px; padding:14px 18px 16px; }

  .ust { grid-column:1/3; display:flex; align-items:center; gap:14px; min-height:36px; }
  .marka { display:flex; align-items:center; gap:9px; font-weight:700; font-size:14px; }
  .marka i { width:24px; height:24px; border-radius:7px; background:var(--mavi); display:grid; place-items:center; color:#fff; font-size:12px; font-style:normal; font-weight:800; }
  .oturum { font-size:12.5px; color:var(--ink3); }
  .adimlar { margin-left:auto; display:flex; gap:4px; background:var(--kart); border:1px solid var(--cizgi); border-radius:999px; padding:3px; }
  .adim { font-size:12px; font-weight:600; color:var(--ink3); padding:5px 12px; border-radius:999px; display:flex; align-items:center; gap:6px; transition:all .6s var(--ease); }
  .adim b { width:5px; height:5px; border-radius:50%; background:var(--cizgi); }
  .adim.gecti { color:var(--ink2); } .adim.gecti b { background:var(--ink3); }
  .adim.aktif { background:var(--ink); color:#fff; } .adim.aktif b { background:var(--sari); }
  .dugme { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--ink2); background:var(--kart); border:1px solid var(--cizgi); border-radius:999px; padding:7px 12px; cursor:pointer; user-select:none; transition:all .3s var(--ease); font-family:inherit; }
  .dugme:hover { border-color:var(--ink3); color:var(--ink); }
  .dugme.mavi { background:var(--mavi); color:#fff; border-color:var(--mavi); }
  .dugme svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.9; }
  .dugme select { border:0; background:transparent; font:inherit; color:inherit; cursor:pointer; }
  .muhur { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--ink2); background:var(--kart); border:1px solid var(--cizgi); border-radius:999px; padding:7px 12px; }
  .muhur svg { width:13px; height:13px; stroke:var(--mavi); fill:none; stroke-width:1.8; }

  .sol { display:flex; flex-direction:column; min-height:0; gap:10px; }
  .baslik .ust-etiket { font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--mavi); margin-bottom:5px; }
  .baslik h1 { margin:0; font-size:clamp(20px,2.1vw,32px); line-height:1.08; font-weight:800; letter-spacing:-.03em; text-wrap:balance; }
  .secenekler { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .secenek { background:var(--kart); border:1px solid var(--cizgi); border-radius:12px; padding:7px 10px 8px; display:grid; grid-template-columns:22px 1fr auto; gap:7px; align-items:center; transition:all .8s var(--ease); min-width:0; }
  .secenek .harf { width:22px; height:22px; border-radius:7px; background:var(--tint); color:var(--mavi); font-weight:800; font-size:12px; display:grid; place-items:center; }
  .secenek .m { font-size:11.5px; color:var(--ink2); line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .secenek .p { font-weight:800; font-size:13px; font-variant-numeric:tabular-nums; min-width:26px; text-align:right; opacity:0; transition:opacity .8s var(--ease); }
  .secenek .bar { grid-column:1/4; height:3px; border-radius:3px; background:var(--tint); overflow:hidden; margin-top:1px; }
  .secenek .bar i { display:block; height:100%; width:0; background:var(--mavi); border-radius:3px; transition:width 1.2s var(--ease); }
  .secenek.secili { border-color:var(--mavi); box-shadow:0 0 0 3px rgba(32,84,255,.12); }
  .secenek.secili .harf { background:var(--mavi); color:#fff; }

  .masa { position:relative; flex:1; min-height:0; border-radius:24px; background:linear-gradient(180deg, var(--tint2), var(--tint) 70%, #dfe5ff); border:1px solid var(--cizgi); overflow:hidden; }
  .masa .halka { position:absolute; left:8%; right:8%; bottom:-14%; height:36%; border-radius:50%; background:radial-gradient(ellipse at center, rgba(32,84,255,.16), rgba(32,84,255,.05) 60%, transparent 72%); }
  .masa .tahta { position:absolute; left:14%; right:14%; bottom:-10%; height:24%; border-radius:50%; background:linear-gradient(180deg,#ffffff,#eef1fb); box-shadow:0 18px 40px rgba(11,16,32,.10), inset 0 1px 0 #fff; }
  .masa svg.arklar { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:5; }
  .koltuk { position:absolute; width:150px; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; transition:transform 1s var(--ease), filter 1s var(--ease), top .9s var(--ease); will-change:transform; }
  .koltuk .govde { position:relative; width:150px; height:var(--ph,180px); }
  .koltuk .govde img { position:absolute; bottom:0; left:50%; transform:translateX(-50%); height:calc(100% * var(--olcek,1)); width:auto; max-width:none; object-fit:contain; filter:drop-shadow(0 16px 20px rgba(11,16,32,.22)); -webkit-mask-image:linear-gradient(180deg,#000 86%,transparent 100%); mask-image:linear-gradient(180deg,#000 86%,transparent 100%); }
  /* 5 kare üst üste: kapalı taban hep görünür; ağız/göz kareleri üstüne yumuşak geçişle biner */
  .koltuk .govde img.kare { opacity:0; transition:opacity .075s linear; animation:none; }
  .koltuk .govde img.kare.kapali { opacity:1; }
  .koltuk .govde img.kare.acik { opacity:1; }
  .koltuk .govde { animation:nefes 4.6s ease-in-out infinite; transform-origin:50% 100%; }
  .koltuk.konusuyor .govde { animation:konus-bas 2.2s ease-in-out infinite; }
  .koltuk { cursor:pointer; }
  @keyframes nefes { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-3px) } }
  @keyframes konus-bas { 0%,100%{ transform:translateY(0) rotate(0) } 22%{ transform:translateY(-3px) rotate(-1deg) } 48%{ transform:translateY(-1px) rotate(.6deg) } 74%{ transform:translateY(-4px) rotate(-.4deg) } }
  .koltuk .siluet { position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:110px; height:140px; border-radius:55px 55px 18px 18px; background:linear-gradient(180deg,#fff,#eef1fb); border:1px solid var(--cizgi); display:grid; place-items:center; font-weight:800; font-size:28px; color:var(--lav); }
  .koltuk .plaka { margin-top:-4px; display:flex; flex-direction:column; align-items:center; background:var(--kart); border:1px solid var(--cizgi); border-radius:12px; padding:5px 11px 6px; box-shadow:0 8px 24px rgba(11,16,32,.08); transition:all .8s var(--ease); z-index:6; position:relative; white-space:nowrap; max-width:146px; }
  .koltuk .plaka .ad { font-weight:800; font-size:12px; letter-spacing:-.01em; line-height:1.1; }
  .koltuk .plaka .pillar { font-size:8.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); margin-top:2px; }
  .koltuk .plaka .oy { display:none; position:absolute; top:-12px; left:50%; transform:translateX(-50%); }
  .koltuk .plaka .oy.var { display:block; }
  .koltuk .plaka.oylu { padding-top:11px; }
  .koltuk .plaka .oy b { display:inline-block; font-size:10.5px; font-weight:800; color:#fff; background:var(--mavi); border-radius:7px; padding:3px 7px; font-variant-numeric:tabular-nums; box-shadow:0 4px 12px rgba(32,84,255,.3); border:2px solid var(--kart); }
  .koltuk.konusuyor { z-index:9; transform:translate(-50%,-100%) translateY(-8px) scale(1.06); }
  .koltuk.konusuyor .plaka { border-color:var(--mavi); box-shadow:0 0 0 3px rgba(32,84,255,.14), 0 12px 30px rgba(32,84,255,.18); }
  .koltuk.sessiz { filter:saturate(.85) brightness(.97); }
  .koltuk .nokta { position:absolute; top:-4px; left:50%; transform:translate(-50%,8px); opacity:0; background:var(--kart); border:1px solid var(--cizgi); border-radius:999px; padding:5px 9px; display:flex; gap:4px; transition:all .5s var(--ease); z-index:7; }
  .koltuk .nokta i { width:5px; height:5px; border-radius:50%; background:var(--mavi); animation:nokta 1s infinite; }
  .koltuk .nokta i:nth-child(2){ animation-delay:.2s } .koltuk .nokta i:nth-child(3){ animation-delay:.4s }
  @keyframes nokta { 0%,100%{opacity:.25; transform:translateY(0)} 50%{opacity:1; transform:translateY(-3px)} }
  .koltuk.dusunuyor .nokta { opacity:1; transform:translate(-50%,0); }
  .balon .metin .kalan { color:transparent; }
  .balon { position:absolute; z-index:10; width:300px; background:var(--kart); border:1px solid var(--cizgi); border-radius:16px; padding:10px 13px 11px; box-shadow:0 20px 50px rgba(11,16,32,.14); opacity:0; transform:translateY(8px) scale(.97); transition:all .6s var(--ease2); pointer-events:none; }
  .balon.goster { opacity:1; transform:none; }
  .balon .kim { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--mavi); margin-bottom:4px; }
  .balon .metin { font-size:13px; line-height:1.38; font-weight:500; color:var(--ink); }
  .balon::after { content:""; position:absolute; left:var(--okx,50%); bottom:-7px; width:13px; height:13px; background:var(--kart); border-right:1px solid var(--cizgi); border-bottom:1px solid var(--cizgi); transform:translateX(-50%) rotate(45deg); border-radius:2px; }
  .balon.yan::after { bottom:auto; top:var(--oky,50%); left:-7px; transform:translateY(-50%) rotate(135deg); }
  .balon.ustten::after { bottom:auto; top:-7px; transform:translateX(-50%) rotate(-135deg); }
  .balon.yan.sol::after { left:auto; right:-7px; transform:translateY(-50%) rotate(-45deg); }
  .ark { fill:none; stroke-width:2; stroke-linecap:round; stroke-dasharray:7 9; opacity:0; animation:ark-gel .9s var(--ease2) forwards, ark-akis 1.2s linear infinite; }
  .ark.itiraz { stroke:var(--mavi); } .ark.kabul { stroke:var(--yesil); }
  @keyframes ark-gel { to{opacity:1} } @keyframes ark-akis { to{stroke-dashoffset:-32} }
  .ark-etiket { font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:0; animation:ark-gel .9s .2s var(--ease2) forwards; }
  .ark-etiket.itiraz { fill:var(--mavi); } .ark-etiket.kabul { fill:var(--yesil); }

  .alt { position:absolute; left:12px; right:12px; bottom:12px; z-index:12; transform:translateY(30px); opacity:0; transition:all 1s var(--ease); pointer-events:none; }
  .alt.goster { transform:none; opacity:1; pointer-events:auto; }
  .karar { background:var(--ink); color:#fff; border-radius:18px; padding:12px 18px; display:grid; grid-template-columns:auto 1fr auto; gap:20px; align-items:center; box-shadow:0 24px 60px rgba(11,16,32,.25); }
  .karar .etiket { display:flex; flex-direction:column; gap:5px; }
  .karar .etiket small { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#9eb4ff; }
  .karar .etiket .pil { display:inline-flex; align-items:center; gap:9px; background:var(--mavi); border-radius:11px; padding:7px 12px; font-weight:800; font-size:18px; letter-spacing:-.01em; }
  .karar .etiket .pil b { background:#fff; color:var(--mavi); border-radius:7px; padding:2px 8px; font-size:14px; }
  .karar .ozet { font-size:13px; line-height:1.38; color:#e9edff; }
  .skor { display:flex; gap:8px; }
  .skor .s { display:flex; flex-direction:column; align-items:center; gap:3px; min-width:44px; }
  .skor .s .bar { width:8px; height:40px; border-radius:5px; background:rgba(255,255,255,.12); position:relative; overflow:hidden; }
  .skor .s .bar i { position:absolute; left:0; right:0; bottom:0; height:0; background:#9eb4ff; border-radius:5px; transition:height 1.2s var(--ease); }
  .skor .s.secili .bar i { background:var(--sari); }
  .skor .s b { font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums; }
  .skor .s span { font-size:9.5px; font-weight:700; letter-spacing:.1em; color:#9eb4ff; }

  .sag { display:flex; flex-direction:column; min-height:0; background:var(--kart); border:1px solid var(--cizgi); border-radius:20px; overflow:hidden; }
  .sag .bas { display:flex; align-items:center; gap:9px; padding:11px 15px; border-bottom:1px solid var(--cizgi); }
  .sag .bas h2 { margin:0; font-size:14px; font-weight:800; }
  .sag .bas span { font-size:11.5px; color:var(--ink3); font-weight:600; }
  .sag .bas .canli { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--ink2); }
  .sag .bas .canli i { width:7px; height:7px; border-radius:50%; background:var(--yesil); animation:nabiz 2s infinite; }
  @keyframes nabiz { 0%{box-shadow:0 0 0 0 rgba(31,157,106,.45)} 70%{box-shadow:0 0 0 8px rgba(31,157,106,0)} 100%{box-shadow:0 0 0 0 rgba(31,157,106,0)} }
  .akis { flex:1; overflow-y:auto; padding:12px 13px 16px; scroll-behavior:smooth; scrollbar-width:thin; scrollbar-color:var(--cizgi) transparent; }
  .tur-etiket { display:flex; align-items:center; gap:10px; font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); margin:8px 0 8px; }
  .tur-etiket::after { content:""; flex:1; height:1px; background:var(--cizgi); }
  .kart { display:grid; grid-template-columns:32px 1fr; gap:9px; margin-bottom:9px; opacity:0; transform:translateY(12px); animation:gel .8s var(--ease2) forwards; }
  @keyframes gel { to{opacity:1; transform:none} }
  .kart .cip { width:32px; height:32px; border-radius:11px; overflow:hidden; background:var(--tint); display:grid; place-items:center; font-weight:800; font-size:11px; color:var(--mavi); }
  .kart .cip img { width:100%; height:100%; object-fit:cover; object-position:top; }
  .kart .govde { background:var(--bg); border:1px solid var(--cizgi); border-radius:14px; padding:9px 12px 10px; font-size:12.5px; line-height:1.42; }
  .kart.son .govde { border-color:var(--mavi); background:#fff; box-shadow:0 0 0 3px rgba(32,84,255,.08); }
  .kart .kim { display:flex; align-items:center; gap:7px; margin-bottom:2px; }
  .kart .kim b { font-size:13px; font-weight:800; }
  .kart .kim span { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); }
  .kart h4 { margin:7px 0 1px; font-size:9.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); }
  .kart p { margin:0 0 2px; color:var(--ink); }
  .kart p.sim { color:var(--ink3); font-size:10px; margin-top:6px; }
  .kart .puan { display:inline-flex; align-items:baseline; gap:3px; background:var(--tint2); border:1px solid var(--cizgi); border-radius:7px; padding:1px 7px; margin:3px 4px 2px 0; font-variant-numeric:tabular-nums; font-size:11.5px; font-weight:600; }
  .kart .puan b { font-weight:800; color:var(--mavi); font-size:12.5px; }
  .kart .risk { color:var(--kirmizi); font-weight:700; }
  .kart .ad-vurgu { color:var(--mavi); font-weight:700; }
  .bos { color:var(--ink3); font-size:13px; padding:40px 10px; text-align:center; }

  @media (max-aspect-ratio: 1/1) {
    .sahne { grid-template-columns:1fr; grid-template-rows:auto auto minmax(0,1fr); padding:14px 14px; }
    .ust { grid-column:1; flex-wrap:wrap; }
    .adimlar { display:none; }
    .secenekler { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .sol .masa { min-height:46vh; }
  }
</style>
</head>
<body>
<div class="sahne">
  <div class="ust">
    <div class="marka"><i>K</i> Kurul odası</div>
    <div class="oturum" id="oturumAd"></div>
    <div class="adimlar" id="adimlar">
      <div class="adim" data-a="brief"><b></b>Brief</div>
      <div class="adim" data-a="tur1"><b></b>Açılış</div>
      <div class="adim" data-a="tur2"><b></b>Tartışma</div>
      <div class="adim" data-a="karar"><b></b>Karar</div>
    </div>
    <div class="muhur" id="muhur"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>Claude'un görüşü mühürlü</span></div>
  </div>

  <div class="sol">
    <div class="baslik">
      <div class="ust-etiket">Masadaki karar</div>
      <h1 id="kararBaslik">Kurul toplanıyor</h1>
    </div>
    <div class="secenekler" id="secenekler"></div>
    <div class="masa" id="masa">
      <div class="halka"></div>
      <div class="tahta"></div>
      <svg class="arklar" id="arklar"></svg>
      <div class="balon" id="balon"><div class="kim" id="balonKim"></div><div class="metin"><span id="balonGor"></span><span id="balonKalan" class="kalan"></span></div></div>
      <div class="alt" id="alt"><div class="karar">
        <div class="etiket"><small>Kurulun kararı</small><div class="pil"><span id="etiket">ŞARTLI YAP</span><b id="etiketSec">B</b></div></div>
        <div class="ozet" id="ozet"></div>
        <div class="skor" id="skor"></div>
      </div></div>
    </div>
  </div>

  <div class="sag">
    <div class="bas"><h2>Tutanak</h2><span id="kartSayac">0 kart</span><div class="canli"><i></i> <span id="canliMetin">canlı</span></div></div>
    <div class="akis" id="akis"><div class="bos">Koltuklar beyinlerini açıyor. İlk kart gelince burada akmaya başlar.</div></div>
  </div>
</div>

<script>
const KOLTUK = {
  buffett:{ad:"Warren Buffett", pillar:"Sermaye ve risk", h:"WB", olcek:1.0},
  bezos:{ad:"Jeff Bezos", pillar:"Müşteri ve sistem", h:"JB", olcek:1.0},
  musk:{ad:"Elon Musk", pillar:"Hız ve mühendislik", h:"EM", olcek:1.0},
  jobs:{ad:"Steve Jobs", pillar:"Ürün ve odak", h:"SJ", olcek:1.06},
  hormozi:{ad:"Alex Hormozi", pillar:"Teklif ve fiyat", h:"AH", olcek:1.0},
  baskan:{ad:"Başkan", pillar:"Claude", h:"C"},
};
const SIRA = ["buffett","bezos","jobs","musk","hormozi"];
const AVATAR = {};
const Q = new URLSearchParams(location.search); const id = Q.get("id");
let OYNAT = Q.get("oynat") === "1"; let ADIM = Number(Q.get("adim") || 5) * 1000;
let gosterilen = OYNAT ? 0 : 1e9, oynatSayac = null, sonHash = "", koltukEl = {}, sonVeri = null, KARARLI = false;
const KARELER = ["kapali","konus","yari","o","goz"];
let sonSoz = {};          // koltuk -> son kartından konuşma metni (hover'da söylenir)
let sonSahne = null;      // son uygulanan sahne durumu (hover bitince geri dönülür)
let sonKonusulan = "";    // otomatik konuşulan son kartın anahtarı (aynı kart tekrar konuşmasın)
let hoverK = null;
addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") oynatBaslat(); if (e.key === "c" || e.key === "C") canliyaDon(); });
function oynatBaslat(){
  OYNAT = true; gosterilen = 0; sonHash = ""; if (oynatSayac) clearInterval(oynatSayac);
  oynatSayac = setInterval(()=>{ if (!sonVeri) return; if (gosterilen <= sonVeri.kartlar.length){ gosterilen++; sonHash = ""; yenile(); } }, ADIM);
  document.getElementById("canliMetin").textContent = "oynatılıyor";
  yenile();
}
function canliyaDon(){ OYNAT = false; gosterilen = 1e9; sonHash = ""; if (oynatSayac) clearInterval(oynatSayac); document.getElementById("canliMetin").textContent = "canlı"; yenile(); }

function masaKur(){
  const m = document.getElementById("masa");
  for (const k of SIRA){
    const d = document.createElement("div"); d.className = "koltuk"; d.id = "k-" + k; d.style.setProperty("--olcek", KOLTUK[k].olcek || 1);
    const av = AVATAR[k];
    d.innerHTML = `<div class="nokta"><i></i><i></i><i></i></div><div class="govde">${av ? KARELER.filter(f=>av[f]).map(f=>`<img class="kare ${f}" data-kare="${f}" src="${av[f]}" alt="">`).join("") : `<div class="siluet">${KOLTUK[k].h}</div>`}</div>
      <div class="plaka"><div class="ad">${KOLTUK[k].ad}</div><div class="pillar">${KOLTUK[k].pillar}</div><div class="oy"><b></b></div></div>`;
    m.appendChild(d); koltukEl[k] = d;
    // Fareyle üstüne gelince (ya da dokununca) son sözünü söyler; çekilince sahne eski hâline döner
    d.addEventListener("mouseenter", () => { if (!sonSoz[k]) return; hoverK = k; konusmayaBasla(k, sonSoz[k]); });
    d.addEventListener("mouseleave", () => { if (hoverK !== k) return; hoverK = null; konusmaDurdur(); if (sonSahne){ sahneUygula(sonSahne); bantGoster(true); } });
    d.addEventListener("click", () => { if (!sonSoz[k]) return; hoverK = k; konusmayaBasla(k, sonSoz[k]); });
    gozKirp(k);
  }
  yerlestir(); addEventListener("resize", () => { yerlestir(); sonHash = ""; yenile(); });
}
function konum(k){
  const m = document.getElementById("masa").getBoundingClientRect();
  const i = SIRA.indexOf(k), n = SIRA.length, u = (i - (n - 1) / 2) / ((n - 1) / 2);
  const uzak = 1 - u * u;
  const dikey = innerHeight > innerWidth;
  // Yatay: düz sıra, hafif kavis (komşu plakalar birbirinin yüzüne binmesin). Karar gelince sıra yukarı kalkar, bant altta kalır.
  const cx = m.width / 2, rx = dikey ? m.width * 0.36 : Math.min(m.width / 2 - 82, 330), ry = m.height * (dikey ? 0.24 : 0.05);
  const cy = m.height * (dikey ? (KARARLI ? 0.56 : 0.88) : (KARARLI ? 0.64 : 0.965));
  return { x: cx + u * rx, y: cy - uzak * ry, uzak };
}
function yerlestir(){
  const m = document.getElementById("masa"), mh = m.getBoundingClientRect().height, dikey = innerHeight > innerWidth;
  m.style.setProperty("--ph", Math.round(dikey ? Math.max(160, Math.min(300, mh * 0.40)) : Math.max(110, Math.min(200, mh * 0.40))) + "px");
  for (const k of SIRA){
    const p = konum(k), d = koltukEl[k];
    d.style.left = p.x + "px"; d.style.top = p.y + "px"; d.style.zIndex = String(5 + Math.round(p.uzak * 2));
    if (!d.classList.contains("konusuyor")) d.style.transform = `translate(-50%,-100%) scale(${(1 - p.uzak * 0.04).toFixed(3)})`;
  }
}
function sekil(t){
  const satir = t.split(/\r?\n/).filter((s,i)=>!(i===0 && s.startsWith("# ")));
  let h = "";
  for (let s of satir){
    s = s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
    if (!s.trim()) continue;
    if (s.startsWith("## ")) { h += `<h4>${s.slice(3)}</h4>`; continue; }
    if (/^_?Simülasyon/i.test(s)) { h += `<p class="sim">${s.replace(/_/g,"")}</p>`; continue; }
    s = s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    s = s.replace(/\b([A-D])\s*:\s*(\d{1,2})\s*\/\s*10/g,'<span class="puan">$1 <b>$2</b>/10</span>');
    s = s.replace(/(için |: )(yüksek)\b/i, '$1<span class="risk">$2</span>');
    for (const k of SIRA) s = s.replace(new RegExp("\\b(" + KOLTUK[k].ad.split(" ")[1] + ")"), '<span class="ad-vurgu">$1</span>');
    h += `<p>${s.replace(/^[-*]\s+/,"")}</p>`;
  }
  return h;
}
function bolum(t, ad){ const m = t.match(new RegExp("##\\s*" + ad + "[^\\n]*\\n+([^\\n#]+)", "i")); return m ? m[1].trim() : ""; }
function puanlar(t){ const out = {}; const re = /\b([A-D])\s*:\s*(\d{1,2})\s*\/\s*10/g; let m; while ((m = re.exec(t))) out[m[1]] = Number(m[2]); return out; }
function hedefKoltuk(metin, haric){ for (const k of SIRA) if (k !== haric && new RegExp(KOLTUK[k].ad.split(" ")[1], "i").test(metin)) return k; return null; }
function portreUst(k){ const r = koltukEl[k].querySelector(".govde").getBoundingClientRect(), m = document.getElementById("masa").getBoundingClientRect(); return {x: r.left + r.width/2 - m.left, y: r.top - m.top + 22, ust: r.top - m.top, w: r.width}; }
function arkCiz(a, b, tur, etiket){
  const svg = document.getElementById("arklar"); const pa = portreUst(a), pb = portreUst(b);
  const mx = (pa.x + pb.x) / 2, my = Math.max(14, Math.min(pa.y, pb.y) - Math.min(70, Math.abs(pa.x - pb.x) * 0.18) - 6);
  const p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", `M${pa.x},${pa.y} Q${mx},${my} ${pb.x},${pb.y}`); p.setAttribute("class", "ark " + tur); svg.appendChild(p);
  // Etiket hedefe yakın (eğrinin %78'i), balonun altında kalmasın
  const tt = 0.78, lx = (1-tt)*(1-tt)*pa.x + 2*(1-tt)*tt*mx + tt*tt*pb.x, ly = (1-tt)*(1-tt)*pa.y + 2*(1-tt)*tt*my + tt*tt*pb.y;
  const t = document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x", lx); t.setAttribute("y", ly - 8); t.setAttribute("text-anchor","middle"); t.setAttribute("class","ark-etiket " + tur); t.textContent = etiket; svg.appendChild(t);
}
// ---- Konuşma motoru: harf harf ağız şekli + baloncukta aynı hızda akan metin ----
function kareGoster(k, kare){
  const d = koltukEl[k]; if (!d) return;
  d.querySelectorAll("img.kare").forEach(i => { if (i.dataset.kare !== "kapali") i.classList.toggle("acik", i.dataset.kare === kare); });
}
function viseme(ch){
  const c = ch.toLowerCase();
  if ("aeâ".includes(c)) return {kare:"konus", sure:95};
  if ("ıiêî".includes(c)) return {kare:"yari", sure:80};
  if ("oöuûü".includes(c)) return {kare:"o", sure:100};
  if ("mbp".includes(c)) return {kare:"kapali", sure:70};
  if (/[a-zçğşñ]/.test(c)) return {kare:"yari", sure:62};
  if (/[0-9$%]/.test(c)) return {kare:"yari", sure:70};
  if (".!?".includes(c)) return {kare:"kapali", sure:320};
  if (",;:".includes(c)) return {kare:"kapali", sure:170};
  if (c === " ") return {kare:"kapali", sure:45};
  return {kare:"kapali", sure:30};
}
let konusma = null; // {k, zaman, bitti}
function konusmayaBasla(k, metin, bitince){
  konusmaDurdur();
  for (const x of SIRA){ koltukEl[x].classList.toggle("sessiz", x !== k); koltukEl[x].classList.toggle("konusuyor", x === k); koltukEl[x].classList.remove("dusunuyor"); }
  koltukEl[k].style.transform = "";
  // Karar bandı açıkken kafaların üstünde yer yok: bant solar, balon plakanın altından çıkar
  const altta = KARARLI, gecikme = altta ? 350 : 0; if (altta) bantGoster(false);
  const gor = document.getElementById("balonGor"), kalan = document.getElementById("balonKalan");
  const ben = { k, zaman: null, bitti: false }; konusma = ben;
  let i = 0, sonKare = "kapali";
  const adim = () => {
    if (konusma !== ben) return;
    if (i >= metin.length){ kareGoster(k, "kapali"); ben.bitti = true; ben.zaman = setTimeout(()=>{ if (konusma === ben && bitince) bitince(); }, 1200); return; }
    const v = viseme(metin[i]);
    // aynı şekil arka arkaya gelirse araya kısa bir "yarı" kare koy (ağız donmasın)
    const kare = (v.kare === sonKare && v.kare !== "kapali" && i % 2) ? "yari" : v.kare;
    kareGoster(k, kare); sonKare = kare;
    i++; gor.textContent = metin.slice(0, i); kalan.textContent = metin.slice(i);
    ben.zaman = setTimeout(adim, v.sure);
  };
  ben.zaman = setTimeout(() => { if (konusma !== ben) return; balonGoster(k, metin, altta); ben.zaman = setTimeout(adim, 380); }, gecikme);
}
function konusmaDurdur(){
  if (konusma){ clearTimeout(konusma.zaman); const k = konusma.k; konusma = null; kareGoster(k, "kapali"); }
  document.getElementById("balon").classList.remove("goster");
}
// Karar bandını göster/gizle (koltuklar yerinde kalır)
function bantGoster(ac){ document.getElementById("alt").classList.toggle("goster", ac && !!(sonSahne && sonSahne.karar)); }
function gozKirp(k){
  const d = koltukEl[k]; const goz = d.querySelector("img.kare.goz"); if (!goz) return;
  const tik = () => { goz.classList.add("acik"); setTimeout(()=>goz.classList.remove("acik"), 130); setTimeout(tik, 2600 + Math.random() * 3800); };
  setTimeout(tik, 800 + Math.random() * 3000);
}
function balonGoster(k, metin, altta){
  const b = document.getElementById("balon"); const m = document.getElementById("masa").getBoundingClientRect(); const p = portreUst(k);
  const w = altta ? 400 : 300; b.classList.remove("yan","sol","ustten"); b.style.width = w + "px";
  document.getElementById("balonKim").textContent = KOLTUK[k].ad + " · " + KOLTUK[k].pillar;
  document.getElementById("balonGor").textContent = ""; document.getElementById("balonKalan").textContent = metin;
  const yuk = b.offsetHeight || 96;
  if (altta){
    const r = koltukEl[k].getBoundingClientRect(); let x = p.x - w / 2; x = Math.max(8, Math.min(m.width - w - 8, x));
    b.style.left = x + "px"; b.style.top = (r.bottom - m.top + 10) + "px"; b.style.setProperty("--okx", (p.x - x) + "px"); b.classList.add("ustten");
  } else if (p.ust - yuk - 12 >= 6){
    let x = p.x - w / 2; x = Math.max(8, Math.min(m.width - w - 8, x));
    b.style.left = x + "px"; b.style.top = (p.ust - yuk - 12) + "px"; b.style.setProperty("--okx", (p.x - x) + "px");
  } else {
    const sag = p.x < m.width / 2; let x = sag ? p.x + p.w / 2 + 6 : p.x - p.w / 2 - 6 - w; x = Math.max(8, Math.min(m.width - w - 8, x));
    b.style.left = x + "px"; b.style.top = Math.max(8, p.y + 10) + "px"; b.classList.add("yan"); if (!sag) b.classList.add("sol"); b.style.setProperty("--oky", "34px");
  }
  b.classList.add("goster");
}
// Kartın konuşma metni: 1. turda Pozisyon + en güçlü gerekçe, 2. turda İtiraz + cevap. Cümle sınırında ~280 karakter.
function konusmaMetni(c){
  const t = c.metin;
  const parcalar = c.tur === "tur2" ? [bolum(t, "İtiraz"), bolum(t, "Çatışma sorusuna cevabım") || bolum(t, "Cevabım"), bolum(t, "Kabul")] : [bolum(t, "Pozisyon"), bolum(t, "En güçlü gerekçe"), bolum(t, "En büyük risk")];
  let m = parcalar.filter(Boolean).join(" ").replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
  if (m.length > 280){ const kes = m.slice(0, 280).search(/[.!?][^.!?]*$/); m = kes > 120 ? m.slice(0, kes + 1) : m.slice(0, 277) + "…"; }
  return m;
}
// Sahne durumu: kim konuşuyor (büyük), kim sırada (üç nokta), yaylar. Konuşmayı başlatmaz.
function sahneUygula(s, yalnizYaylar){
  if (!yalnizYaylar){
    for (const k of SIRA){ koltukEl[k].classList.toggle("sessiz", !!s.son && k !== s.son.kim); koltukEl[k].classList.toggle("konusuyor", !!s.son && k === s.son.kim); koltukEl[k].classList.toggle("dusunuyor", !!s.son && k === s.sirada); }
    if (s.son) koltukEl[s.son.kim].style.transform = "";
  }
  document.getElementById("arklar").innerHTML = "";
  if (s.son && s.son.tur === "tur2"){
    const it = hedefKoltuk(bolum(s.son.metin, "İtiraz"), s.son.kim); if (it) setTimeout(()=>arkCiz(s.son.kim, it, "itiraz", "itiraz"), 400);
    const kb = hedefKoltuk(bolum(s.son.metin, "Kabul"), s.son.kim); if (kb && kb !== it) setTimeout(()=>arkCiz(s.son.kim, kb, "kabul", "kabul"), 800);
  }
}
function kartHtml(c, son){
  const k = KOLTUK[c.kim] || {ad:c.isim, pillar:"", h:c.kim.slice(0,2).toUpperCase()};
  const cip = AVATAR[c.kim] ? `<img src="${AVATAR[c.kim].kapali}" alt="">` : k.h;
  return `<div class="kart ${son ? "son" : ""}"><div class="cip">${cip}</div><div class="govde"><div class="kim"><b>${k.ad}</b><span>${c.tur === "tur1" ? "1. tur" : c.tur === "tur2" ? "2. tur" : ""}</span></div>${sekil(c.metin)}</div></div>`;
}
function briefCoz(b){
  const satir = b.split(/\r?\n/);
  const baslik = (satir.find(s=>s.startsWith("# ")) || "").replace(/^#\s*/,"").replace(/^(Brief|Karar)\s*[:·]\s*/i,"");
  const sec = []; for (const s of satir){ const m = s.match(/^\s*[-*]?\s*\*\*([A-D])[:.]?\*\*[:.]?\s*(.+)$/) || s.match(/^\s*[-*]?\s*([A-D])[:.)]\s+(.+)$/); if (m && !sec.some(x=>x.h===m[1])) sec.push({h:m[1], t:m[2].replace(/\*\*/g,"")}); }
  return {baslik, sec};
}
function kararOzet(k){ const satir = k.split(/\r?\n/).filter(s=>s.trim() && !s.startsWith("#") && !s.startsWith("|")); return (satir[0] || "").replace(/\*\*/g,"").replace(/^[-*]\s*/,"").replace(/^(Tek satır|Karar|Özet)\s*:\s*/i, ""); }
function adimlariGuncelle(asama){
  const sira = ["brief","tur1","tur2","karar"]; const i = sira.indexOf(asama);
  document.querySelectorAll(".adim").forEach(a => { const j = sira.indexOf(a.dataset.a); a.classList.toggle("aktif", j === i); a.classList.toggle("gecti", j < i); });
}
async function yenile(){
  let v; try { v = await (await fetch("/api/oturum" + (id ? "?id=" + encodeURIComponent(id) : ""), {cache:"no-store"})).json(); } catch(e){ return; }
  sonVeri = v;
  if (OYNAT){
    const toplam = v.kartlar.length;
    v = Object.assign({}, v, { kartlar: v.kartlar.slice(0, Math.min(gosterilen, toplam)), karar: gosterilen > toplam ? v.karar : "", karar_json: gosterilen > toplam ? v.karar_json : null });
    if (gosterilen > toplam && oynatSayac){ clearInterval(oynatSayac); oynatSayac = null; document.getElementById("canliMetin").textContent = "bitti · R ile tekrar"; }
  }
  const hash = JSON.stringify([v.oturum, v.kartlar.map(c=>c.mtime), !!v.karar, (v.brief||"").length, v.muhur_var, OYNAT, gosterilen]);
  if (hash === sonHash) return; sonHash = hash;
  KARARLI = !!v.karar;
  document.getElementById("oturumAd").textContent = v.oturum ? v.oturum.replace(/^\d{4}-\d{2}-\d{2}-/, "").replace(/-/g," ") : "";
  const b = briefCoz(v.brief || "");
  document.getElementById("kararBaslik").textContent = b.baslik || (v.oturum ? "Brief yazılıyor" : "Kurul toplanıyor");
  const sonTurAd = v.kartlar.some(c=>c.tur==="tur2") ? "tur2" : "tur1";
  const toplam = {}, sayi = {};
  for (const c of v.kartlar.filter(c=>c.tur===sonTurAd && SIRA.includes(c.kim))){ const p = puanlar(c.metin); for (const h in p){ toplam[h] = (toplam[h]||0) + p[h]; sayi[h] = (sayi[h]||0) + 1; } }
  const secEl = document.getElementById("secenekler");
  secEl.innerHTML = b.sec.map(s=>{ const ort = sayi[s.h] ? (toplam[s.h]/sayi[s.h]) : null; return `<div class="secenek" id="sec-${s.h}" title="${s.t.replace(/"/g,"&quot;")}"><div class="harf">${s.h}</div><div class="m">${s.t}</div><div class="p" style="opacity:${ort!==null?1:0}">${ort!==null?ort.toFixed(1):""}</div><div class="bar"><i data-w="${ort!==null?ort*10:0}"></i></div></div>`; }).join("");
  requestAnimationFrame(()=>requestAnimationFrame(()=>secEl.querySelectorAll(".bar i").forEach(i=>i.style.width = i.dataset.w + "%")));
  yerlestir();
  const akis = document.getElementById("akis");
  if (!v.kartlar.length){ akis.innerHTML = '<div class="bos">Koltuklar beyinlerini açıyor. İlk kart gelince burada akmaya başlar.</div>'; }
  else { let h = "", sonTur = ""; v.kartlar.forEach((c, i) => { if (c.tur !== sonTur){ sonTur = c.tur; h += `<div class="tur-etiket">${c.tur === "tur1" ? "Birinci tur · açılış kartları" : "İkinci tur · tartışma"}</div>`; } h += kartHtml(c, i === v.kartlar.length - 1); }); akis.innerHTML = h; akis.scrollTop = akis.scrollHeight; }
  document.getElementById("kartSayac").textContent = v.kartlar.length + " kart";
  for (const k of SIRA){
    const kart = [...v.kartlar].reverse().find(c=>c.kim===k); const oy = koltukEl[k].querySelector(".oy");
    let oylu = false;
    if (kart){ const p = puanlar(kart.metin); const en = Object.entries(p).sort((a,b)=>b[1]-a[1])[0]; if (en){ oylu = true; oy.classList.add("var"); oy.querySelector("b").textContent = en[0] + " · " + en[1]; } }
    if (!oylu) oy.classList.remove("var");
    oy.parentElement.classList.toggle("oylu", oylu);
  }
  // Her koltuğun son sözü (hover'da söylenir)
  for (const k of SIRA){ const kart = [...v.kartlar].reverse().find(c=>c.kim===k); sonSoz[k] = kart ? konusmaMetni(kart) : ""; }
  const son = v.kartlar.filter(c=>SIRA.includes(c.kim)).slice(-1)[0];
  const sirada = son ? SIRA.find(k => !v.kartlar.some(c=>c.kim===k && c.tur===son.tur)) : null;
  sonSahne = { son: (son && !v.karar) ? son : null, sirada, karar: !!v.karar };
  const anahtar = son ? son.kim + "|" + son.tur + "|" + son.mtime : "";
  if (!hoverK){
    konusmaDurdur(); sahneUygula(sonSahne);
    if (sonSahne.son && anahtar !== sonKonusulan){ sonKonusulan = anahtar; setTimeout(()=>{ if (!hoverK && sonSahne && sonSahne.son === son) konusmayaBasla(son.kim, sonSoz[son.kim], () => sahneUygula(sonSahne)); }, 350); }
  } else { sahneUygula(sonSahne, true); }
  if (!sonSahne.son) yerlestir();
  const n1 = v.kartlar.filter(c=>c.tur==="tur1" && SIRA.includes(c.kim)).length, n2 = v.kartlar.filter(c=>c.tur==="tur2" && SIRA.includes(c.kim)).length;
  adimlariGuncelle(v.karar ? "karar" : n2 ? "tur2" : n1 ? "tur1" : "brief");
  document.getElementById("muhur").querySelector("span").textContent = v.karar ? "Mühür açıldı" : v.muhur_var ? "Claude'un görüşü mühürlü" : "Mühür bekleniyor";
  const alt = document.getElementById("alt");
  if (v.karar){
    const j = v.karar_json || {};
    document.getElementById("etiket").textContent = j.etiket || "KARAR"; document.getElementById("etiketSec").textContent = j.secenek || "";
    document.getElementById("ozet").textContent = j.karar || kararOzet(v.karar);
    const sk = document.getElementById("skor"); const secs = Object.keys(j.ortalama || {});
    sk.innerHTML = secs.map(s=>`<div class="s ${s===j.secenek?"secili":""}"><div class="bar"><i data-h="${Math.min(100,(j.ortalama[s]/10)*100)}"></i></div><b>${Number(j.ortalama[s]).toFixed(1)}</b><span>${s}</span></div>`).join("");
    if (j.secenek){ const se = document.getElementById("sec-" + j.secenek); if (se) se.classList.add("secili"); }
    alt.classList.add("goster");
    requestAnimationFrame(()=>requestAnimationFrame(()=>sk.querySelectorAll("i").forEach(i=>i.style.height = i.dataset.h + "%")));
  } else alt.classList.remove("goster");
}
(async function(){
  for (const k of SIRA){
    try { const r = await fetch(`portre/avatar/${k}_a.png`, {method:"HEAD"}); if (!r.ok) continue; } catch(e){ continue; }
    AVATAR[k] = {kapali:`portre/avatar/${k}_a.png`};
    for (const f of ["konus","yari","o","goz"]){ try { const r = await fetch(`portre/avatar/${k}_${f}_a.png`, {method:"HEAD"}); if (r.ok) AVATAR[k][f] = `portre/avatar/${k}_${f}_a.png`; } catch(e){} }
  }
  masaKur();
  if (OYNAT) oynatBaslat(); else yenile();
  setInterval(()=>{ if (!OYNAT) yenile(); }, 1500);
})();
